<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H 型离散模型到连续方程二维投影</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212b;
      --muted: #5b6876;
      --line: #c9d3df;
      --panel: #f7f9fb;
      --accent: #0e7c86;
      --accent-2: #b43f5f;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    header {
      padding: 18px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: #eef4f7;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      max-width: 1100px;
    }

    main {
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: calc(100vh - 88px);
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
      overflow: auto;
    }

    .content {
      padding: 16px;
      overflow: auto;
    }

    .group {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .group h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
    }

    label {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
      font-size: 13px;
      color: var(--ink);
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
    }

    select,
    button {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      min-height: 34px;
      padding: 6px 9px;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      background: white;
      border-radius: 6px;
      padding: 8px;
      min-height: 54px;
    }

    .metric b {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric span {
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      font-weight: 700;
    }

    .panes {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(360px, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 12px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .h-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .h-cell {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      min-height: 118px;
      background: #fbfdfe;
      position: relative;
    }

    .h-cell.current {
      outline: 3px solid var(--accent);
      outline-offset: 1px;
    }

    .mini-h {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      height: 74px;
    }

    .mini-h div {
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: #ecf2f5;
      font-weight: 700;
      font-size: 13px;
      color: #17202b;
    }

    .mini-h .empty {
      background: transparent;
      border: 1px dashed #b9c4ce;
      color: transparent;
    }

    .cell-label {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    canvas {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #101820;
    }

    .canvas-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      max-width: 720px;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 22px 1fr;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.15);
    }

    .equation {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfdfe;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #24313c;
    }

    @media (max-width: 920px) {
      main,
      .panes {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>H 型离散模型 → 连续方程 → 二维平面投影</h1>
    <div class="sub">离散 H 九宫格先映射为复数场 ψ=Ae<sup>iθ</sup>，再按复 Ginzburg-Landau 方程演化。画布颜色表示投影回 1..7 能级后的数字，相位沿二维方向展开。</div>
  </header>

  <main>
    <aside>
      <div class="group">
        <h2>离散初始态</h2>
        <label>
          起始输入角
          <select id="start">
            <option value="0,2">右上 Q1</option>
            <option value="0,0">左上 Q2</option>
            <option value="2,2">右下 Q6</option>
            <option value="2,0">左下 Q7</option>
          </select>
        </label>
        <label>
          投影模式
          <select id="mode">
            <option value="phase">相位能级</option>
            <option value="amplitude">幅值</option>
            <option value="mixed">幅值+相位</option>
          </select>
        </label>
      </div>

      <div class="group">
        <h2>连续方程参数</h2>
        <label>α 生长 <span id="alphaValue"></span><input id="alpha" type="range" min="-0.2" max="1.8" step="0.01" value="1.0"></label>
        <label>ω 旋转 <span id="omegaValue"></span><input id="omega" type="range" min="-2" max="2" step="0.01" value="0.4"></label>
        <label>β 饱和 <span id="betaValue"></span><input id="beta" type="range" min="0" max="2" step="0.01" value="1.0"></label>
        <label>γ 非线性相位 <span id="gammaValue"></span><input id="gamma" type="range" min="-2" max="2" step="0.01" value="0.0"></label>
        <label>D 扩散/耦合 <span id="diffusionValue"></span><input id="diffusion" type="range" min="0" max="0.6" step="0.005" value="0.08"></label>
        <label>dt 时间步 <span id="dtValue"></span><input id="dt" type="range" min="0.002" max="0.05" step="0.001" value="0.01"></label>
      </div>

      <div class="group">
        <h2>运行</h2>
        <div class="buttons">
          <button class="primary" id="toggle">运行</button>
          <button id="step">单步</button>
          <button id="reset">重置</button>
          <button id="pulse">弱刺激</button>
        </div>
        <div class="readout">
          <div class="metric"><b>t</b><span id="time">0</span></div>
          <div class="metric"><b>D_path</b><span id="pathOp">-1</span></div>
          <div class="metric"><b>平均幅值</b><span id="amp">1.000</span></div>
          <div class="metric"><b>相干度 R</b><span id="coh">0.000</span></div>
          <div class="metric"><b>投影稳定率</b><span id="stable">100%</span></div>
          <div class="metric"><b>弱刺激幅值</b><span id="mem">0.000</span></div>
        </div>
      </div>

      <div class="equation">
        ∂ψ/∂t = (α+iω)ψ − (β+iγ)|ψ|²ψ + D∇²ψ<br>
        θₙ = π/2 + (n−4)π/7<br>
        x+y=8 ⇔ zₓzᵧ = −1
      </div>
    </aside>

    <section class="content">
      <div class="panes">
        <div class="panel">
          <h2>离散九宫格 H 投影基</h2>
          <div class="h-grid" id="hGrid"></div>
        </div>

        <div class="panel">
          <h2>二维连续场与离散能级投影</h2>
          <div class="canvas-row">
            <canvas id="field" width="360" height="360"></canvas>
            <div class="legend" id="legend"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const EMPTY = null;
    const SIZE = 90;
    const TWO_PI = Math.PI * 2;
    const PHASE_CENTER = Math.PI / 2;
    const PHASE_STEP = Math.PI / 7;

    const H_STATES = {
      A: [[2, EMPTY, 1], [3, 4, 5], [7, EMPTY, 6]],
      B: [[7, EMPTY, 6], [3, 4, 5], [2, EMPTY, 1]],
      C: [[1, EMPTY, 2], [5, 4, 3], [6, EMPTY, 7]],
      D: [[6, EMPTY, 7], [5, 4, 3], [1, EMPTY, 2]],
    };

    const PATTERN = [["A", "B", "A"], ["C", "D", "C"], ["A", "B", "A"]];
    const PATHS = {
      "0,0": [[0,0],[0,1],[0,2],[1,2],[1,1],[1,0],[2,0],[2,1],[2,2]],
      "0,2": [[0,2],[0,1],[0,0],[1,0],[1,1],[1,2],[2,2],[2,1],[2,0]],
      "2,0": [[2,0],[2,1],[2,2],[1,2],[1,1],[1,0],[0,0],[0,1],[0,2]],
      "2,2": [[2,2],[2,1],[2,0],[1,0],[1,1],[1,2],[0,2],[0,1],[0,0]],
    };

    const COLORS = {
      1: "#d13c4b",
      2: "#e3912e",
      3: "#d9c944",
      4: "#31a66a",
      5: "#1f9bb6",
      6: "#4169d8",
      7: "#8f4bd1",
    };

    const controls = {};
    for (const id of ["start", "mode", "alpha", "omega", "beta", "gamma", "diffusion", "dt"]) {
      controls[id] = document.getElementById(id);
    }

    const readout = {};
    for (const id of ["time", "pathOp", "amp", "coh", "stable", "mem"]) {
      readout[id] = document.getElementById(id);
    }

    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const hGrid = document.getElementById("hGrid");
    const toggleButton = document.getElementById("toggle");
    const stepButton = document.getElementById("step");
    const resetButton = document.getElementById("reset");
    const pulseButton = document.getElementById("pulse");

    let re = new Float64Array(SIZE * SIZE);
    let im = new Float64Array(SIZE * SIZE);
    let nextRe = new Float64Array(SIZE * SIZE);
    let nextIm = new Float64Array(SIZE * SIZE);
    let projected = new Uint8Array(SIZE * SIZE);
    let running = false;
    let time = 0;
    let weakMembrane = 0;

    function phaseAngle(digit) {
      return PHASE_CENTER + (digit - 4) * PHASE_STEP;
    }

    function digitComplex(digit, amplitude = 1) {
      const theta = phaseAngle(digit);
      return [amplitude * Math.cos(theta), amplitude * Math.sin(theta)];
    }

    function wrapAngle(value) {
      let wrapped = (value + Math.PI) % TWO_PI - Math.PI;
      if (wrapped <= -Math.PI) wrapped += TWO_PI;
      return wrapped;
    }

    function nearestDigit(a, b) {
      const theta = Math.atan2(b, a);
      let best = 1;
      let bestDelta = Infinity;
      for (let digit = 1; digit <= 7; digit++) {
        const delta = Math.abs(wrapAngle(theta - phaseAngle(digit)));
        if (delta < bestDelta) {
          best = digit;
          bestDelta = delta;
        }
      }
      return best;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function colorFor(digit, amplitude, mode) {
      if (mode === "amplitude") {
        const v = Math.max(0, Math.min(255, Math.round(40 + amplitude * 150)));
        return [v, Math.round(v * 0.88), Math.round(255 - v * 0.45)];
      }
      const base = hexToRgb(COLORS[digit]);
      if (mode === "mixed") {
        const gain = Math.max(0.25, Math.min(1.25, amplitude));
        return base.map(v => Math.max(0, Math.min(255, Math.round(lerp(24, v, gain)))));
      }
      return base;
    }

    function pathKey() {
      return controls.start.value;
    }

    function stateAtCell(row, col) {
      return H_STATES[PATTERN[row][col]];
    }

    function centerDigitForCell(row, col) {
      const state = stateAtCell(row, col);
      const flat = state.flat().filter(v => v !== EMPTY);
      return flat[(row + col * 2) % flat.length];
    }

    function pathDigitForIndex(i) {
      const path = PATHS[pathKey()];
      const coord = path[i % path.length];
      const state = stateAtCell(coord[0], coord[1]);
      const flat = state.flat().filter(v => v !== EMPTY);
      return flat[i % flat.length];
    }

    function seedField() {
      const path = PATHS[pathKey()];
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const gx = Math.min(2, Math.floor(x / (SIZE / 3)));
          const gy = Math.min(2, Math.floor(y / (SIZE / 3)));
          const localX = (x - gx * SIZE / 3) / (SIZE / 3);
          const localY = (y - gy * SIZE / 3) / (SIZE / 3);
          const cellIndex = path.findIndex(([r, c]) => r === gy && c === gx);
          const pathBias = cellIndex >= 0 ? pathDigitForIndex(cellIndex) : centerDigitForCell(gy, gx);
          const micro = H_STATES[PATTERN[gy][gx]];
          const hx = Math.min(2, Math.floor(localX * 3));
          const hy = Math.min(2, Math.floor(localY * 3));
          const raw = micro[hy][hx];
          const digit = raw === EMPTY ? pathBias : raw;
          const amp = raw === EMPTY ? 0.55 : 1.0;
          const phaseOffset = cellIndex >= 0 ? cellIndex * Math.PI / 8 : 0;
          const theta = phaseAngle(digit) + phaseOffset * 0.12;
          const idx = y * SIZE + x;
          re[idx] = amp * Math.cos(theta);
          im[idx] = amp * Math.sin(theta);
        }
      }
      time = 0;
      weakMembrane = 0;
      projectField();
      render();
      renderHGrid();
    }

    function params() {
      return {
        alpha: Number(controls.alpha.value),
        omega: Number(controls.omega.value),
        beta: Number(controls.beta.value),
        gamma: Number(controls.gamma.value),
        diffusion: Number(controls.diffusion.value),
        dt: Number(controls.dt.value),
      };
    }

    function stepCgl() {
      const p = params();
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const idx = y * SIZE + x;
          const left = y * SIZE + Math.max(0, x - 1);
          const right = y * SIZE + Math.min(SIZE - 1, x + 1);
          const up = Math.max(0, y - 1) * SIZE + x;
          const down = Math.min(SIZE - 1, y + 1) * SIZE + x;

          const a = re[idx];
          const b = im[idx];
          const lapRe = re[left] + re[right] + re[up] + re[down] - 4 * a;
          const lapIm = im[left] + im[right] + im[up] + im[down] - 4 * b;
          const mag2 = a * a + b * b;

          const linRe = p.alpha * a - p.omega * b;
          const linIm = p.alpha * b + p.omega * a;
          const nonRe = mag2 * (p.beta * a - p.gamma * b);
          const nonIm = mag2 * (p.beta * b + p.gamma * a);

          nextRe[idx] = a + p.dt * (linRe - nonRe + p.diffusion * lapRe);
          nextIm[idx] = b + p.dt * (linIm - nonIm + p.diffusion * lapIm);
        }
      }
      [re, nextRe] = [nextRe, re];
      [im, nextIm] = [nextIm, im];
      time += 1;
      projectField();
    }

    function projectField() {
      for (let i = 0; i < projected.length; i++) {
        projected[i] = nearestDigit(re[i], im[i]);
      }
    }

    function weakPulse() {
      weakMembrane += 1 / 3;
      const path = PATHS[pathKey()];
      const coord = path[0];
      const x0 = Math.floor(coord[1] * SIZE / 3);
      const y0 = Math.floor(coord[0] * SIZE / 3);
      const x1 = Math.floor((coord[1] + 1) * SIZE / 3);
      const y1 = Math.floor((coord[0] + 1) * SIZE / 3);
      const amp = weakMembrane >= 1 ? 1.45 : 1 + weakMembrane * 0.35;
      const theta = phaseAngle(4) + weakMembrane * Math.PI;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const idx = y * SIZE + x;
          re[idx] = amp * Math.cos(theta);
          im[idx] = amp * Math.sin(theta);
        }
      }
      if (weakMembrane >= 1) weakMembrane = 0;
      projectField();
      render();
    }

    function metrics() {
      let ampSum = 0;
      let cosSum = 0;
      let sinSum = 0;
      let stableCount = 0;
      for (let i = 0; i < re.length; i++) {
        const amp = Math.hypot(re[i], im[i]);
        ampSum += amp;
        if (amp > 1e-9) {
          cosSum += re[i] / amp;
          sinSum += im[i] / amp;
        }
        const digit = projected[i];
        const theta = Math.atan2(im[i], re[i]);
        if (Math.abs(wrapAngle(theta - phaseAngle(digit))) < PHASE_STEP / 2) {
          stableCount += 1;
        }
      }
      const n = re.length;
      return {
        amp: ampSum / n,
        coh: Math.hypot(cosSum / n, sinSum / n),
        stable: stableCount / n,
      };
    }

    function render() {
      const image = ctx.createImageData(SIZE, SIZE);
      const mode = controls.mode.value;
      for (let i = 0; i < projected.length; i++) {
        const amp = Math.hypot(re[i], im[i]);
        const [r, g, b] = colorFor(projected[i], amp, mode);
        const j = i * 4;
        image.data[j] = r;
        image.data[j + 1] = g;
        image.data[j + 2] = b;
        image.data[j + 3] = 255;
      }
      const off = document.createElement("canvas");
      off.width = SIZE;
      off.height = SIZE;
      off.getContext("2d").putImageData(image, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
      drawPathOverlay();
      updateReadout();
    }

    function drawPathOverlay() {
      const path = PATHS[pathKey()];
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        const [r, c] = path[i];
        const x = (c + 0.5) * canvas.width / 3;
        const y = (r + 0.5) * canvas.height / 3;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.fillStyle = "white";
      for (let i = 0; i < path.length; i++) {
        const [r, c] = path[i];
        const x = (c + 0.5) * canvas.width / 3;
        const y = (r + 0.5) * canvas.height / 3;
        ctx.beginPath();
        ctx.arc(x, y, i === 0 ? 7 : 5, 0, TWO_PI);
        ctx.fill();
      }
      ctx.restore();
    }

    function renderHGrid() {
      const path = PATHS[pathKey()].map(([r, c]) => `${r},${c}`);
      hGrid.innerHTML = "";
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const div = document.createElement("div");
          div.className = "h-cell" + (path[0] === `${r},${c}` ? " current" : "");
          const mini = document.createElement("div");
          mini.className = "mini-h";
          for (const value of H_STATES[PATTERN[r][c]].flat()) {
            const cell = document.createElement("div");
            if (value === EMPTY) {
              cell.className = "empty";
              cell.textContent = ".";
            } else {
              cell.textContent = value;
              cell.style.background = COLORS[value];
              cell.style.color = value >= 5 ? "white" : "#17202b";
            }
            mini.appendChild(cell);
          }
          const label = document.createElement("div");
          label.className = "cell-label";
          label.innerHTML = `<span>${r},${c}</span><strong>${PATTERN[r][c]}</strong>`;
          div.appendChild(mini);
          div.appendChild(label);
          hGrid.appendChild(div);
        }
      }
    }

    function renderLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      for (let digit = 1; digit <= 7; digit++) {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="swatch" style="background:${COLORS[digit]}"></span><span>${digit}</span>`;
        legend.appendChild(item);
      }
    }

    function updateReadout() {
      const m = metrics();
      readout.time.textContent = String(time);
      readout.pathOp.textContent = "-1";
      readout.amp.textContent = m.amp.toFixed(3);
      readout.coh.textContent = m.coh.toFixed(3);
      readout.stable.textContent = `${Math.round(m.stable * 100)}%`;
      readout.mem.textContent = weakMembrane.toFixed(3);
    }

    function syncLabels() {
      for (const id of ["alpha", "omega", "beta", "gamma", "diffusion", "dt"]) {
        document.getElementById(`${id}Value`).textContent = Number(controls[id].value).toFixed(id === "dt" ? 3 : 2);
      }
    }

    function tick() {
      if (running) {
        for (let i = 0; i < 2; i++) stepCgl();
        render();
      }
      requestAnimationFrame(tick);
    }

    for (const control of Object.values(controls)) {
      control.addEventListener("input", () => {
        syncLabels();
        if (control.id === "start") seedField();
        else render();
      });
    }

    toggleButton.addEventListener("click", () => {
      running = !running;
      toggleButton.textContent = running ? "暂停" : "运行";
    });
    stepButton.addEventListener("click", () => {
      stepCgl();
      render();
    });
    resetButton.addEventListener("click", seedField);
    pulseButton.addEventListener("click", weakPulse);

    syncLabels();
    renderLegend();
    seedField();
    tick();
  </script>
</body>
</html>
